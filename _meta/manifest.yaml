# Databricks Brain: master manifest.
#
# This file is the blueprint for the vault: every chapter, every planned note,
# and the strongest edges between them. `scripts/scaffold.py` reads it to create
# missing stubs. After a note exists, its own frontmatter is the source of truth;
# `scripts/build_index.py` reads the notes (not this file) to build the agent index.
#
# Per-note keys:
#   title           note name (also the filename, so no / : ? characters)
#   depth           101 beginner, 201 practitioner, 301 advanced, 401 expert
#   summary         one plain-English line; agents and llms.txt read it
#   personas        who cares most (see personas list below)
#   aliases         other names, including old product names
#   related, evolved_from, evolved_into, cloud_equivalent: note titles

personas:
  everyone: Anyone new to data
  owner: Business owner or executive
  analyst: Analyst or BI developer
  engineer: Data engineer
  scientist: Data scientist or ML engineer
  ai-dev: AI or application developer
  admin: Platform or cloud admin
  security: Security, privacy, or compliance lead
  finance: Finance or FinOps
  solo: One-person data team at a small business

chapters:

  - folder: 00_is_databricks_for_you
