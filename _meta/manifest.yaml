      - title: How Databricks Pricing Works
        depth: 101
        personas: [owner, finance, solo]
        summary: DBUs, cloud bills, serverless versus classic, and why there are two invoices.
        related: [DBUs, Cost Management Basics, Serverless Compute]
      - title: Estimating Costs for a Small Business
