      - title: Apache Iceberg
        depth: 201
        personas: [engineer, admin]
        summary: The Netflix-born table format, Delta's main rival, now first-class in Unity Catalog.
        related: [Delta UniForm, Open Table Formats]
      - title: Apache Hudi
        depth: 301
        personas: [engineer]
        summary: The Uber-born table format focused on upserts and incremental processing.
